# ─────────────────────────────────────────────────────────────────────────────
# MicroProfile Config 3.1 — application properties
# Ordinal: 100 (lowest default; overridden by env vars at 300, sys props at 400)
# ─────────────────────────────────────────────────────────────────────────────

# ── Bookstore (@ConfigProperties prefix = "bookstore") ───────────────────────
bookstore.name=Payara Bookstore (Dev)
bookstore.max-results=20
bookstore.currency=EUR
bookstore.adminEmail=admin@bookstore.local
bookstore.cdn.base-url=https://cdn.bookstore.local

# ── Feature flags (Supplier<Boolean> — change here at runtime to toggle without restart) ──
# [Config 3.1] Supplier<Boolean> re-reads this file on every .get() call when
# the ConfigSource supports dynamic updates (cluster or Vault sources do; this
# file does not, but the pattern is identical).
bookstore.feature.recommendations.enabled=false
bookstore.feature.preview.categories=fiction,sci-fi,programming

# ── REST Client 4.0 — configKey = "isbn-lookup-api" ──────────────────────────
# [CONTRAST — MP 6.1 / REST Client 3.0] In older versions the key was the
# fully-qualified interface name:
#   fish.payara.demo.mp71.client.IsbnClient/mp-rest/url=...
# REST Client 4.0 allows a short configKey declared on @RegisterRestClient:
isbn-lookup-api/mp-rest/url=https://openlibrary.org
isbn-lookup-api/mp-rest/connectTimeout=2000
isbn-lookup-api/mp-rest/readTimeout=3000

# ── JWT 2.1 ───────────────────────────────────────────────────────────────────
mp.jwt.verify.issuer=https://accounts.payara.fish
mp.jwt.verify.publickey.location=META-INF/public-key.pem

# ── MicroProfile Telemetry 2.0 / OpenTelemetry configuration ─────────────────
# [MP 7.1 / Telemetry 2.0] Standard OTel properties are read by the Telemetry
# implementation from the MicroProfile Config runtime.
# [CONTRAST — MP 6.1 / Telemetry 1.x] Exporter configuration was vendor-specific;
# Telemetry 2.0 standardises on the OTel SDK property names.
otel.sdk.disabled=false
otel.traces.exporter=otlp
otel.exporter.otlp.protocol=http/protobuf
otel.exporter.otlp.endpoint=http://localhost:4318
